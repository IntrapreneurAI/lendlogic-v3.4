<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendLogic v3.5 - Lender Matching Algorithm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        
        .background-pattern {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            opacity: 0.05;
            z-index: 0;
        }
        
        .content-wrapper {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
        }
        
        .logo-area {
            margin-bottom: 40px;
        }
        
        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #0066FF 0%, #00C9A7 100%);
            color: #FFFFFF;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 72px;
            font-weight: 800;
            color: #1A2B4A;
            margin-bottom: 20px;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 36px;
            font-weight: 600;
            color: #0066FF;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }
        
        .tagline {
            font-size: 20px;
            color: #2C3E50;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto 50px;
        }
        
        .metrics-bar {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 50px;
        }
        
        .metric-card {
            text-align: center;
        }
        
        .metric-value {
            font-size: 48px;
            font-weight: 800;
            color: #0066FF;
            line-height: 1;
            margin-bottom: 8px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #2C3E50;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .accent-line {
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, #0066FF 0%, #00C9A7 100%);
            margin: 0 auto 40px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Background Pattern -->
        <svg class="background-pattern" viewBox="0 0 640 720" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="100" y="50" width="200" height="4" fill="#1A2B4A"/>
            <rect x="350" y="150" width="150" height="4" fill="#0066FF"/>
            <rect x="150" y="250" width="250" height="4" fill="#00C9A7"/>
            <rect x="400" y="350" width="180" height="4" fill="#1A2B4A"/>
            <rect x="200" y="450" width="220" height="4" fill="#0066FF"/>
            <rect x="450" y="550" width="160" height="4" fill="#00C9A7"/>
            <circle cx="520" cy="100" r="40" stroke="#0066FF" stroke-width="3" fill="none" opacity="0.3"/>
            <circle cx="580" cy="300" r="60" stroke="#00C9A7" stroke-width="3" fill="none" opacity="0.3"/>
            <circle cx="540" cy="500" r="50" stroke="#1A2B4A" stroke-width="3" fill="none" opacity="0.3"/>
        </svg>
        
        <div class="content-wrapper">
            <div class="logo-area">
                <div class="version-badge">VERSION 3.5</div>
            </div>
            
            <h1>LendLogic</h1>
            <div class="subtitle">Lender Matching Algorithm</div>
            
            <div class="accent-line"></div>
            
            <p class="tagline">
                Intelligent, data-driven lender matching powered by a five-factor weighted scoring system that processes 246 lending programs in real-time
            </p>
            
            <div class="metrics-bar">
                <div class="metric-card">
                    <div class="metric-value">246</div>
                    <div class="metric-label">Programs</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">28</div>
                    <div class="metric-label">Funders</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">5</div>
                    <div class="metric-label">Factors</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
